<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Echoes of Truth{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2993/2993910.png">

</head>
<body class="flex bg-green-50 min-h-screen font-sans">

    <!-- Sidebar -->
    <aside class="w-64 bg-blue-100 text-blue-900 p-6 fixed h-full shadow-lg">
        <h1 class="text-2xl font-extrabold mb-10 text-blue-800">Echoes of Truth</h1>
        <nav class="space-y-4 text-lg">
            <a href="{% url 'home' %}" class="block hover:text-blue-600">🏠 Home</a>
            <a href="{% url 'content_list' %}" class="block hover:text-blue-600">🎬 Content</a>
            <a href="{% url 'courses' %}" class="block hover:text-blue-600">📚 Courses</a>
            <a href="{% url 'ai' %}" class="block hover:text-blue-600">🗣️ Echoes</a>
            <a href="{% url 'about' %}" class="block hover:text-blue-600">ℹ️ About</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="ml-64 p-10 w-full bg-green-50 min-h-screen transition duration-500">
        <div class="flex-1 min-h-screen p-6 bg-green-50 border-l border-gray-300 shadow-inner">
            {% block content %}
            {% endblock %}
        </div>
        
    </main>

</body>
</html>
